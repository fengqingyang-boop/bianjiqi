<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档编辑器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-group">
            <button id="btn-new" title="新建 (Ctrl+N)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20M10,13H7V11H10V9H12V11H15V13H12V15H10V13Z" />
                </svg>
            </button>
            <button id="btn-open" title="打开 (Ctrl+O)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M20,6H12L10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6M20,18H4V6H9.17L11.17,8H20V18M12.94,11L15.76,13.83L12.94,16.66L11.53,15.25L12.94,13.83L10.11,11L11.53,9.59L12.94,11M18.5,12C18.5,10.61 17.35,9.5 15.96,9.5C14.56,9.5 13.41,10.61 13.41,12C13.41,12.83 13.82,13.57 14.46,14L15.96,15.5L17.46,14C18.1,13.57 18.5,12.83 18.5,12Z" />
                </svg>
            </button>
            <button id="btn-save" title="保存 (Ctrl+S)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M15,9H5V5H15M12,19A3,3 0 0,1 9,16A3,3 0 0,1 12,13A3,3 0 0,1 15,16A3,3 0 0,1 12,19M17,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3Z" />
                </svg>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <button id="btn-undo" title="撤销 (Ctrl+Z)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.15,8 12.5,8Z" />
                </svg>
            </button>
            <button id="btn-redo" title="重做 (Ctrl+Y)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M18.4,10.6C16.55,9 14.15,8 11.5,8C6.85,8 2.92,11.03 1.54,15.22L3.9,16C4.95,12.81 7.95,10.5 11.5,10.5C13.45,10.5 15.23,11.22 16.62,12.38L13,16H22V7L18.4,10.6Z" />
                </svg>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <button id="btn-cut" title="剪切 (Ctrl+X)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M12,2L14.39,5.42C13.65,5.15 12.84,5 12,5C11.16,5 10.35,5.15 9.61,5.42L12,2M3.34,7L7.5,6.65C6.9,7.16 6.36,7.78 5.94,8.5C5.5,9.24 5.25,10 5.11,10.79L3.34,7M3.36,17L5.12,13.23C5.26,14 5.53,14.78 5.95,15.5C6.37,16.24 6.91,16.86 7.5,17.37L3.36,17M20.65,7L18.88,10.79C18.74,10 18.47,9.23 18.05,8.5C17.63,7.78 17.1,7.15 16.5,6.64L20.65,7M20.64,17L16.5,17.36C17.09,16.85 17.62,16.22 18.04,15.5C18.46,14.77 18.73,14 18.87,13.21L20.64,17M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z" />
                </svg>
            </button>
            <button id="btn-copy" title="复制 (Ctrl+C)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" />
                </svg>
            </button>
            <button id="btn-paste" title="粘贴 (Ctrl+V)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M19,9H13V3.5L19,9M17,14A4,4 0 0,1 13,18H6V6H9V12H15V14M18,16.5L13,21.5V18H4A2,2 0 0,1 2,16V6A2,2 0 0,1 4,4H10L12,2H20A2,2 0 0,1 22,4V16A2,2 0 0,1 20,18H15V16.5H18Z" />
                </svg>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
            <button id="btn-image" title="插入图片 (Ctrl+I)">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M21,19V5C21,3.89 20.1,3 19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19M19,19H5V5H19V19M17,15.53L14.25,12L11.38,15.64L8.63,12.25L6,15.5V17H18V15.53H17M13,9.25A1.25,1.25 0 0,1 14.25,8A1.25,1.25 0 0,1 15.5,9.25A1.25,1.25 0 0,1 14.25,10.5A1.25,1.25 0 0,1 13,9.25Z" />
                </svg>
            </button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
            <div id="status-text">就绪</div>
        </div>
    </div>
    <div class="editor-container">
        <textarea id="editor" placeholder="在此输入文档内容..."></textarea>
        <div id="images-container"></div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
